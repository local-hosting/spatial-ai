name: Build spatial-ai runtime image

on:
  push:
    branches: [main]
    paths:
      - 'runtime/**'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/build-image.yml'
  workflow_dispatch:
    inputs:
      deploy_tag:
        description: 'Also tag ghcr.io/local-hosting/spatial-ai:<tag> (e.g. main)'
        required: true
        default: main
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: build-spatial-ai-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/local-hosting/spatial-ai
  TOOLCHAIN_NODE: "26"
  TOOLCHAIN_YARN: "4.18.1"
  YARN_NPM_AUTH_TOKEN: ${{ secrets.LOCAL_HOSTING_REPO_TOKEN }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Require build token
        env:
          PAT: ${{ secrets.LOCAL_HOSTING_REPO_TOKEN }}
        run: |
          if [ -z "${PAT}" ]; then
            echo "::error::Set LOCAL_HOSTING_REPO_TOKEN (clone sibling repos + read GitHub Packages)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          repository: local-hosting/workspace
          token: ${{ secrets.LOCAL_HOSTING_REPO_TOKEN }}
          path: ws
      - uses: actions/checkout@v4
        with:
          repository: local-hosting/comms
          token: ${{ secrets.LOCAL_HOSTING_REPO_TOKEN }}
          path: ws/comms
      - uses: actions/checkout@v4
        with:
          repository: local-hosting/frames
          token: ${{ secrets.LOCAL_HOSTING_REPO_TOKEN }}
          path: ws/frames
      - uses: actions/checkout@v4
        with:
          repository: local-hosting/compose
          token: ${{ secrets.LOCAL_HOSTING_REPO_TOKEN }}
          path: ws/compose
      - uses: actions/checkout@v4
        with:
          repository: local-hosting/vocab
          token: ${{ secrets.LOCAL_HOSTING_REPO_TOKEN }}
          path: ws/vocab
      - uses: actions/checkout@v4
        with:
          repository: local-hosting/local-ai
          token: ${{ secrets.LOCAL_HOSTING_REPO_TOKEN }}
          path: ws/local-ai
      - uses: actions/checkout@v4
        with:
          path: ws/spatial-ai

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.TOOLCHAIN_NODE }}

      - name: Enable Yarn
        run: corepack enable && corepack prepare yarn@${{ env.TOOLCHAIN_YARN }} --activate

      - name: Build stack (same as spatial-ai ci)
        working-directory: ws
        run: |
          set -euo pipefail
          yarn install --immutable
          yarn bootstrap:stack
          yarn workspace @local-hosting/local-ai build
          yarn workspace @local-hosting/spatial-ai build
          chmod +x spatial-ai/runtime/boot.sh spatial-ai/runtime/start-gliner.sh spatial-ai/runtime/wait-gliner.sh
          chmod +x local-ai/runtime/boot.sh local-ai/runtime/start-llama.sh local-ai/runtime/wait-llama.sh

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker build and push
        env:
          BRANCH_TAG: ${{ inputs.deploy_tag || github.ref_name }}
        run: |
          set -euo pipefail
          TAG_SHA="${IMAGE_NAME}:${GITHUB_SHA}"
          TAG_BRANCH="${IMAGE_NAME}:${BRANCH_TAG}"
          export DOCKER_BUILDKIT=1
          cp ws/spatial-ai/runtime/dockerignore ws/.dockerignore
          docker build \
            -f ws/spatial-ai/runtime/Dockerfile.ghci \
            -t "${TAG_SHA}" \
            -t "${TAG_BRANCH}" \
            ws
          docker push "${TAG_SHA}"
          docker push "${TAG_BRANCH}"
          echo "pushed ${TAG_SHA}"
          echo "pushed ${TAG_BRANCH}"