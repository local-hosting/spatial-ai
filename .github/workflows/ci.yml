name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: local-hosting/workspace
          token: ${{ secrets.LOCAL_HOSTING_REPO_TOKEN }}
          path: ws
      - uses: actions/checkout@v4
        with:
          repository: local-hosting/comms
          token: ${{ secrets.LOCAL_HOSTING_REPO_TOKEN }}
          path: ws/comms
      - uses: actions/checkout@v4
        with:
          repository: local-hosting/frames
          token: ${{ secrets.LOCAL_HOSTING_REPO_TOKEN }}
          path: ws/frames
      - uses: actions/checkout@v4
        with:
          repository: local-hosting/compose
          token: ${{ secrets.LOCAL_HOSTING_REPO_TOKEN }}
          path: ws/compose
      - uses: actions/checkout@v4
        with:
          repository: local-hosting/local-ai
          token: ${{ secrets.LOCAL_HOSTING_REPO_TOKEN }}
          path: ws/local-ai
      - uses: actions/checkout@v4
        with:
          path: ws/spatial-ai
      - uses: actions/checkout@v4
        with:
          repository: local-hosting/geokit
          token: ${{ secrets.LOCAL_HOSTING_REPO_TOKEN }}
          path: ws/geokit
      - uses: actions/checkout@v4
        with:
          repository: local-hosting/geotypes
          token: ${{ secrets.LOCAL_HOSTING_REPO_TOKEN }}
          path: ws/geotypes
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install geokit (Yarn 4)
        working-directory: ws/geokit
        run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate
          yarn install --immutable
      - name: Install geotypes (Yarn 4)
        working-directory: ws/geotypes
        run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate
          yarn install --immutable
      - working-directory: ws
        run: yarn install --ignore-engines
      - working-directory: ws
        run: yarn bootstrap:stack && yarn build:geokit && yarn workspace @local-hosting/geotypes build
      - working-directory: ws
        run: yarn workspace @local-hosting/spatial-ai ci