<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spatial AI — local chat</title>
    <link rel="stylesheet" href="./main.css" />
  </head>
  <body
    class="h-dvh overflow-hidden bg-slate-950 text-slate-100 font-sans antialiased"
  >
    <div class="app-shell flex h-dvh w-full flex-col md:flex-row">
      <aside
        class="session-map-pane relative shrink-0"
        aria-label="Session map"
      >
        <div id="session-map-host" class="session-map-layer"></div>
      </aside>

      <div
        class="chat-pane flex min-h-0 min-w-0 flex-1 flex-col px-4 py-4 md:py-6 md:pl-6 md:pr-8"
      >
      <header class="mb-4 flex shrink-0 items-start justify-between gap-4">
        <div>
          <h1 class="text-xl font-semibold tracking-tight text-white">
            Spatial AI
          </h1>
          <p class="mt-1 text-sm text-slate-400">
            Loopback chat against
            <code class="rounded bg-slate-800 px-1.5 py-0.5 text-xs"
              >POST /chat</code
            >
          </p>
        </div>
        <span
          id="health-pill"
          class="shrink-0 rounded-full border border-slate-700 bg-slate-900 px-3 py-1 text-xs text-slate-400"
          >checking…</span
        >
      </header>

      <main
        id="thread"
        class="mb-4 flex min-h-0 flex-1 flex-col gap-3 overflow-y-auto rounded-xl border border-slate-800 bg-slate-900/50 p-4"
        aria-live="polite"
      >
        <div
          class="rounded-lg border border-slate-700/80 bg-slate-800/60 px-4 py-3 text-sm text-slate-300"
        >
          Ask a place-grounded question. Default
          <span class="text-slate-100">rules-only</span> compose works without
          llama or GLiNER. Lat/lon updates the map on the left.
        </div>
      </main>

        <form
          id="composer"
          class="shrink-0 space-y-3 rounded-xl border border-slate-800 bg-slate-900 p-4 shadow-lg shadow-black/20"
        >
        <label class="block text-sm font-medium text-slate-300" for="message"
          >Message</label
        >
        <textarea
          id="message"
          name="message"
          rows="3"
          required
          placeholder="where can I go that is safe?"
          class="w-full resize-y rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-white placeholder:text-slate-500 focus:border-sky-500 focus:outline-none focus:ring-1 focus:ring-sky-500"
        ></textarea>

        <div class="grid grid-cols-2 gap-3 lg:grid-cols-5">
          <div>
            <label class="mb-1 block text-xs text-slate-400" for="spatial-mode"
              >Mode</label
            >
            <select
              id="spatial-mode"
              class="w-full rounded-lg border border-slate-700 bg-slate-950 px-2 py-2 text-sm"
            >
              <option value="everyday">everyday</option>
              <option value="resilience" selected>resilience</option>
            </select>
          </div>
          <div>
            <label class="mb-1 block text-xs text-slate-400" for="lang"
              >Language</label
            >
            <select
              id="lang"
              class="w-full rounded-lg border border-slate-700 bg-slate-950 px-2 py-2 text-sm"
            >
              <option value="en" selected>en</option>
              <option value="es">es</option>
              <option value="fr">fr</option>
              <option value="ar">ar</option>
              <option value="he">he</option>
              <option value="hi">hi</option>
              <option value="it">it</option>
              <option value="nl">nl</option>
              <option value="pt">pt</option>
              <option value="ta">ta</option>
              <option value="zh-Hans">zh-Hans</option>
              <option value="zh-Hant">zh-Hant</option>
            </select>
          </div>
          <div>
            <label class="mb-1 block text-xs text-slate-400" for="lat"
              >Lat</label
            >
            <input
              id="lat"
              type="number"
              step="any"
              value="40.7128"
              class="w-full rounded-lg border border-slate-700 bg-slate-950 px-2 py-2 text-sm"
            />
          </div>
          <div>
            <label class="mb-1 block text-xs text-slate-400" for="lon"
              >Lon</label
            >
            <input
              id="lon"
              type="number"
              step="any"
              value="-74.006"
              class="w-full rounded-lg border border-slate-700 bg-slate-950 px-2 py-2 text-sm"
            />
          </div>
          <div class="flex items-end">
            <label
              class="flex w-full cursor-pointer items-center gap-2 rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm"
            >
              <input
                id="rules-only"
                type="checkbox"
                checked
                class="rounded border-slate-600 bg-slate-900 text-sky-500"
              />
              Rules only
            </label>
          </div>
        </div>

        <div class="flex items-center justify-end gap-3">
          <p id="error" class="mr-auto text-sm text-rose-400 hidden"></p>
          <button
            type="submit"
            id="send"
            class="rounded-lg bg-sky-600 px-4 py-2 text-sm font-medium text-white hover:bg-sky-500 disabled:cursor-not-allowed disabled:opacity-50"
          >
            Send
          </button>
        </div>
        </form>

      <p class="mt-3 shrink-0 text-center text-xs text-slate-600 md:text-left">
        API metadata at
        <a class="text-slate-500 underline" href="/" id="json-link">GET /</a>
        (JSON) ·
        <a class="text-slate-500 underline" href="/health">health</a>
      </p>
      </div>
    </div>

    <script type="module" src="./chat.ts"></script>
  </body>
</html>
